[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",  # Import errors
    "E7",  # Statement style errors
    "E9",  # Runtime and syntax-related errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["semantic_firewall"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
